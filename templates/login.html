<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login - Instituto Arara Azul</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            padding: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #e5f3ff, #f1f8f4);
            color: #26384a;
        }

        .login-container {
            width: 100%;
            max-width: 440px;
            padding: 36px;
            background: white;
            border: 1px solid #d8e8f5;
            border-radius: 20px;
            box-shadow: 0 12px 35px rgba(7, 82, 155, 0.12);
        }

        .marca {
            width: 64px;
            height: 64px;
            margin: 0 auto 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            background: #e2f4e9;
            color: #16734b;
            font-size: 30px;
            font-weight: bold;
        }

        h1 {
            margin: 0;
            color: #07529b;
            text-align: center;
            font-size: 27px;
        }

        .subtitulo {
            margin: 12px 0 28px;
            color: #526b85;
            line-height: 1.6;
            text-align: center;
        }

        label {
            display: block;
            margin: 17px 0 8px;
            color: #26384a;
            font-weight: bold;
        }

        input {
            width: 100%;
            min-height: 48px;
            padding: 13px;
            border: 1px solid #b9cfe3;
            border-radius: 9px;
            background: #fbfdff;
            color: #26384a;
            font-size: 16px;
        }

        input:focus-visible {
            outline: 3px solid #c4e1ff;
            border-color: #0868c9;
        }

        button {
            width: 100%;
            min-height: 48px;
            margin-top: 25px;
            padding: 13px;
            border: none;
            border-radius: 9px;
            background: #16734b;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover {
            background: #105b3a;
        }

        button:focus-visible {
            outline: 3px solid #f0a500;
            outline-offset: 3px;
        }

        .mensagem {
            padding: 12px;
            border-radius: 8px;
            background: #fff0f0;
            color: #9b2222;
            line-height: 1.5;
        }

        .rodape {
            margin: 25px 0 0;
            color: #637b93;
            text-align: center;
            font-size: 13px;
            line-height: 1.5;
        }

        @media (max-width: 480px) {
            .login-container {
                padding: 26px 20px;
            }

            h1 {
                font-size: 24px;
            }
        }
    </style>
</head>

<body>
    <main class="login-container">
        <div class="marca" aria-hidden="true">AA</div>

        <h1>Instituto Arara Azul</h1>

        <p class="subtitulo">
            Organização e acompanhamento de atividades
        </p>

        {% with mensagens = get_flashed_messages(with_categories=true) %}
            {% for categoria, mensagem in mensagens %}
                <p class="mensagem" role="alert">
                    {{ mensagem }}
                </p>
            {% endfor %}
        {% endwith %}

        <form method="POST">
            <label for="email">E-mail</label>
            <input
                type="email"
                id="email"
                name="email"
                autocomplete="username"
                required
            >

            <label for="senha">Senha</label>
            <input
                type="password"
                id="senha"
                name="senha"
                autocomplete="current-password"
                required
            >

            <button type="submit">Entrar no sistema</button>
        </form>

        <p class="rodape">
            Juntos pela preservação da natureza.
        </p>
    </main>
</body>
</html>
